name: Create Release

on:
  push:
    tags:
      - v*

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        architecture: [i386, amd64]
        include:
          - architecture: i386
            build-arch: x86
            build-name: i386-windows
          - architecture: amd64
            build-arch: x64
            build-name: amd64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.build-arch }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Download 7zip binaries
        run: |
          curl -sL -o 7z2501-extra.7z https://www.7-zip.org/a/7z2501-extra.7z
          if ("${{ matrix.architecture }}" -eq "i386") {
            7z e 7z2501-extra.7z -odist/bin/7zip 7z*.*
          } else {
            7z e 7z2501-extra.7z -odist/bin/7zip x64/7z*.*
          }
          Remove-Item 7z2501-extra.7z

      - name: Build the executable (Onedir mode)
        run: |
          pyinstaller .\src\it_claws\main.py -cD -n ${{ github.event.repository.name }} `
            --collect-all selenium --collect-all inquirer --copy-metadata readchar

      - name: Package into zip
        run: |
          cd .\dist\
          7z a "${{ github.event.repository.name }}.${{ matrix.build-name }}.zip" ./${{ github.event.repository.name }} -mx9

      - name: Package bundle zip
        run: |
          cd .\dist\
          7z a "${{ github.event.repository.name }}.${{ matrix.build-name }}-bundle.zip" .\${{ github.event.repository.name }}\bin\7zip\7za.exe
          7z a "${{ github.event.repository.name }}.${{ matrix.build-name }}-bundle.zip" .\${{ github.event.repository.name }} -mx9

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}.${{ matrix.architecture }}
          path: |
            dist/${{ github.event.repository.name }}.${{ matrix.build-name }}.zip
            dist/${{ github.event.repository.name }}.${{ matrix.build-name }}-bundle.zip

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: dist/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          generate_release_notes: true